[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-rag"
version = "0.2.0"
description = "ATLAS: Analysis and Testing of Language Models for Archival Systems - A test harness for evaluating LLM RAG systems for HASS research"
authors = [
    {name = "AI as Infrastructure Project", email = "james.smithies@anu.edu.au"}
]
license = {text = "MIT"}
readme = "ReadMe.md"
requires-python = ">=3.10"
keywords = ["llm", "rag", "evaluation", "research", "digital-humanities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "gunicorn==23.0.0",
    "python-multipart==0.0.20",
    "websockets==15.0.1",

    # Vector Search Support
    "chromadb==1.0.15",
    "langchain-chroma==0.2.4",

    # BM25 Search Support
    "rank-bm25==0.2.2",

    # LLM & LangChain Dependencies
    "langchain==0.3.27",
    "langchain-community==0.3.27",
    "langchain-core>=0.3.72,<1.0.0",
    "langchain-huggingface==0.2.0",
    "langchain-openai==0.3.16",
    "langchain-ollama==0.3.2",
    "langchain-anthropic==0.3.13",
    "langchain-aws==0.2.27",
    "langchain-google-genai==2.1.6",
    "langchainhub==0.1.21",
    "tiktoken==0.9.0",
    "anthropic[vertex]==0.51.0",
    "openai==1.78.0",
    "sounddevice==0.5.1",
    "google-auth==2.40.1",

    # AI/ML Model Dependencies (excluding torch - see optional-dependencies)
    "transformers==4.53.0",
    "unstructured==0.17.2",

    # Utilities
    "python-dotenv==1.1.0",
    "numpy==1.26.4",
    "asgiref==3.8.1",
    "requests==2.32.4",
    "python-jose[cryptography]==3.5.0",
    "redis==5.0.1",
    "slowapi==0.1.9",
    "psutil==5.9.8",

    # GraphQL and Pydantic
    "strawberry-graphql==0.270.1",
    "pydantic==2.11.4",
    "pydantic-compat==0.1.2",
    "lark==1.2.2",

    # Observability
    "arize-phoenix==12.9.0",
    "arize-phoenix-client==1.21.0",
    "arize-phoenix-otel==0.10.3",
    "arize-phoenix-evals==2.5.0",
    "openinference-instrumentation-langchain==0.1.43",
    "opentelemetry-exporter-otlp==1.34.0",
    "opentelemetry-sdk==1.34.0",
    "httpx>=0.25.0,<0.28.0",
    "pandas>=1.5.0,<3.0.0",

    # Vector Store Creation Dependencies
    "nltk==3.9.1",
    "langchain-text-splitters==0.3.9",
    "tqdm==4.67.1",
    "sentence-transformers==2.6.1",

    # Corpus Wizard Dependencies
    "gitpython==3.1.41",

    # Load Testing Dependencies
    "locust==2.20.0",
    "websocket-client==1.7.0",
    "faker==22.0.0",
    "pyyaml==6.0.1",

    # Analysis Dependencies
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<0.14.0",
]

[project.optional-dependencies]
# CPU-only PyTorch (smallest, portable, ~200MB)
cpu = [
    "torch>=2.8.0",
]

# CUDA 11.8 for GTX 10xx, RTX 20xx, RTX 30xx (compute capability 6.x - 8.x)
# Install with: uv pip install -e ".[cuda118]" --index-url https://download.pytorch.org/whl/cu118
cuda118 = [
    "torch>=2.8.0",
]

# CUDA 12.1 for RTX 40xx series (compute capability 8.9)
# Install with: uv pip install -e ".[cuda121]"
cuda121 = [
    "torch>=2.8.0",
]

# CUDA 12.4+ nightly for RTX 50xx series (compute capability 12.0+)
# Install with: uv pip install -e ".[cuda124-nightly]" --index-url https://download.pytorch.org/whl/nightly/cu124
cuda124-nightly = [
    "torch>=2.7.0.dev",
]

[project.urls]
Homepage = "https://github.com/AI-as-Infrastructure/aiinfra-atlas"
Repository = "https://github.com/AI-as-Infrastructure/aiinfra-atlas"
Documentation = "https://github.com/AI-as-Infrastructure/aiinfra-atlas/tree/main/docs"
"Bug Tracker" = "https://github.com/AI-as-Infrastructure/aiinfra-atlas/issues"

[tool.setuptools]
packages = ["backend"]
