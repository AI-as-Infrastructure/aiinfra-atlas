<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out</title>
    <script>
        // Handle token cleanup and Cognito logout
        window.onload = function() {
            // Check if we're coming back from Cognito logout (has logout parameter)
            const urlParams = new URLSearchParams(window.location.search);
            const isReturningFromCognito = urlParams.has('logout') || urlParams.has('state');
            
            if (isReturningFromCognito) {
                // We're returning from Cognito logout, final cleanup and redirect to home
                console.log('Returning from Cognito logout, redirecting to home');
                setTimeout(function() {
                    const redirectUrl = "__VITE_API_URL__" || '/';
                    window.location.href = redirectUrl;
                }, 1000);
                return;
            }
            
            // First visit - clear local tokens and redirect to Cognito logout
            console.log('Starting logout process...');
            
            // Clear OIDC and Cognito tokens from localStorage
            Object.keys(localStorage).forEach(function(key) {
                if (key.indexOf("oidc.user:") === 0 || 
                    key.indexOf("CognitoIdentityServiceProvider") === 0 ||
                    key.indexOf("amplify-signin-with-hostedUI") === 0) {
                    localStorage.removeItem(key);
                }
            });
            
            // Clear sessionStorage
            sessionStorage.clear();
            
            // Clear any authentication cookies
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
            
            // Redirect to Cognito logout endpoint
            setTimeout(function() {
                const cognitoLogoutUrl = "__VITE_COGNITO_LOGOUT_ENDPOINT__";
                const clientId = "__VITE_COGNITO_CLIENT_ID__";
                const logoutUri = "__VITE_COGNITO_LOGOUT_REDIRECT_URI__";
                
                if (cognitoLogoutUrl && clientId && logoutUri) {
                    const logoutUrl = `${cognitoLogoutUrl}?client_id=${clientId}&logout_uri=${encodeURIComponent(logoutUri)}`;
                    console.log('Redirecting to Cognito logout:', logoutUrl);
                    window.location.href = logoutUrl;
                } else {
                    console.log('Cognito logout URL not configured, redirecting to home');
                    const redirectUrl = "__VITE_API_URL__" || '/';
                    window.location.href = redirectUrl;
                }
            }, 500);
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .logout-container {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Logging Out...</h1>
        <p>Clearing session data and logging out from authentication provider.</p>
    </div>
</body>
</html>
