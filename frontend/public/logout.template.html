<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - Logging Out</title>
    <script>
        // Constants for Cognito logout (will be replaced with environment values)
        const COGNITO_LOGOUT_ENDPOINT = "__VITE_COGNITO_LOGOUT_ENDPOINT__";
        const COGNITO_CLIENT_ID = "__VITE_COGNITO_CLIENT_ID__";
        const COGNITO_LOGOUT_REDIRECT_URI = "__VITE_COGNITO_LOGOUT_REDIRECT_URI__";
        const USE_COGNITO_AUTH = "__VITE_USE_COGNITO_AUTH__" === "true";
        const API_URL = "__VITE_API_URL__" || '/';
        
        // Logout function - handles both Cognito and local storage clearing
        window.onload = function() {
            console.log('Starting logout process...');
            
            // Parse URL to check if we're already in the logout flow
            const urlParams = new URLSearchParams(window.location.search);
            const logoutState = urlParams.get('state');
            
            // Always clear browser storage regardless of flow
            clearBrowserStorage();
            
            // Determine next action based on the logout state
            if (logoutState === 'complete') {
                // If we've completed the Cognito logout and returned here, redirect to home
                console.log('Cognito logout complete, redirecting to application home');
                redirectToHome();
            } else if (canUseCognitoLogout()) {
                // First phase - redirect to Cognito for session invalidation
                // Add a parameter to our redirect URI to track the logout state
                let logoutRedirectUri = COGNITO_LOGOUT_REDIRECT_URI;
                
                // Make sure it's using the proper protocol
                if (window.location.protocol === 'https:' && logoutRedirectUri.startsWith('http:')) {
                    logoutRedirectUri = logoutRedirectUri.replace('http:', 'https:');
                    console.log('Updated redirect URI protocol to HTTPS:', logoutRedirectUri);
                }
                
                // Add state parameter to track that we've been to Cognito
                const redirectUriWithState = new URL(logoutRedirectUri);
                redirectUriWithState.searchParams.set('state', 'complete');
                
                const logoutUrl = `${COGNITO_LOGOUT_ENDPOINT}?client_id=${COGNITO_CLIENT_ID}&logout_uri=${encodeURIComponent(redirectUriWithState.toString())}`;
                console.log('Redirecting to Cognito logout URL:', logoutUrl);
                window.location.replace(logoutUrl);
            } else {
                // Simple logout for development or when Cognito isn't configured
                console.log('Using direct logout (no Cognito), redirecting to home');
                redirectToHome();
            }
        };
        
        // Helper function to check if we can use Cognito logout
        function canUseCognitoLogout() {
            const hasCognitoConfig = COGNITO_LOGOUT_ENDPOINT && 
                                  COGNITO_CLIENT_ID && 
                                  COGNITO_LOGOUT_REDIRECT_URI;
                                  
            return USE_COGNITO_AUTH && hasCognitoConfig;
        }
        
        // Helper function to clear browser storage
        function clearBrowserStorage() {
            // Clear localStorage auth-related keys
            console.log('Clearing localStorage tokens...');
            Object.keys(localStorage).forEach(function(key) {
                if (key.indexOf("oidc.user:") === 0 || 
                    key.indexOf("CognitoIdentityServiceProvider") === 0 ||
                    key.indexOf("amplify-signin-with-hostedUI") === 0 ||
                    key.indexOf("auth") === 0) {
                    console.log('Removing localStorage key:', key);
                    localStorage.removeItem(key);
                }
            });
            
            // Clear session storage
            console.log('Clearing sessionStorage...');
            sessionStorage.clear();
            
            // Clear cookies
            console.log('Clearing cookies...');
            document.cookie.split(";").forEach(function(c) {
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
            });
        }
        
        // Helper function to redirect to home
        function redirectToHome() {
            // Get the redirect URL from environment variable
            let redirectUrl = API_URL || '/';
            
            // Match protocol if needed (enforce HTTPS if we're on HTTPS)
            if (window.location.protocol === 'https:' && redirectUrl.startsWith('http:')) {
                redirectUrl = redirectUrl.replace('http:', 'https:');
                console.log('Matched redirect protocol to current (HTTPS):', redirectUrl);
            }
            
            console.log('Redirecting to home:', redirectUrl);
            window.location.replace(redirectUrl);
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .logout-container {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>Logging Out...</h1>
        <p>Clearing session data and redirecting...</p>
    </div>
</body>
</html>
