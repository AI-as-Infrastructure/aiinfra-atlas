# Darwin Correspondence Project Configuration
metadata:
  name: "Darwin Correspondence Project"
  description: "Letters and papers of Charles Darwin and his correspondents"
  time_period_from: 1825
  time_period_to: 1882
  copyright_status: "mixed"
  copyright_statement: "Original letters public domain, transcriptions CC-BY 4.0"
  doi: "10.5281/zenodo.example"
  citation: "Darwin Correspondence Project, University of Cambridge"
  people: ["Charles Darwin", "Thomas Huxley", "Alfred Wallace", "Joseph Hooker", "Charles Lyell"]
  places: ["London", "Cambridge", "Down House", "Galapagos", "Brazil"]
  topics: ["evolution", "natural selection", "biology", "geology", "botany", "correspondence"]
  organization_preferences: ["by_time_period", "by_person", "by_topic"]

source:
  type: "github"
  location: "https://github.com/AI-as-Infrastructure/aiinfra-atlas-darwin"
  branch: "main"
  path: "corpus/"
  file_types: ["xml", "txt"]

filters:
  - id: "all"
    label: "All Letters"
    pattern: "**/*"
  - id: "1820s"
    label: "1820s"
    pattern: "**/182[0-9]/**/*"
  - id: "1830s"
    label: "1830s"
    pattern: "**/183[0-9]/**/*"
  - id: "1840s"
    label: "1840s"
    pattern: "**/184[0-9]/**/*"
  - id: "1850s"
    label: "1850s"
    pattern: "**/185[0-9]/**/*"
  - id: "1860s"
    label: "1860s"
    pattern: "**/186[0-9]/**/*"
  - id: "1870s"
    label: "1870s"
    pattern: "**/187[0-9]/**/*"
  - id: "1880s"
    label: "1880s"
    pattern: "**/188[0-9]/**/*"
  - id: "darwin"
    label: "Charles Darwin"
    pattern: "**/darwin/**/*"
    metadata_field: "author"
  - id: "huxley"
    label: "Thomas Huxley"
    pattern: "**/huxley/**/*"
    metadata_field: "author"
  - id: "wallace"
    label: "Alfred Wallace"
    pattern: "**/wallace/**/*"
    metadata_field: "author"

embeddings:
  model: "Livingwithmachines/bert_1760_1900"
  pooling: "mean"
  chunk_size: 1000
  chunk_overlap: 100
  batch_size: 100

vector_store:
  type: "chromadb"
  collection_name: "darwin_correspondence"
  persist_directory: "backend/targets/chroma_db"

search:
  type: "hybrid"
  k_default: 10
  large_single_corpus: 120
  large_all_corpus: 80
  test_query: "evolution natural selection species"