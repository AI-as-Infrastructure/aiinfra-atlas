# Production Environment Configuration for ATLAS Load Testing

# Environment Settings
environment:
  name: "production"
  host: "${VITE_API_URL}"  # Uses VITE_API_URL from .env.production
  api_version: "v1"

# Authentication Configuration
# Load tests assume VITE_USE_COGNITO_AUTH=false in .env files
# IMPORTANT: Only disable auth for load testing, re-enable for production use

# Redis Configuration
redis:
  url: "${REDIS_URL}"
  password: "${REDIS_PASSWORD}"
  queue_name: "llm_request_queue"
  ttl: 3600  # 1 hour

# Load Testing Parameters
load_test:
  # User Distribution (percentages should sum to 100)
  user_distribution:
    question_users: 70      # Users primarily asking questions
    feedback_users: 20      # Users primarily giving feedback
    mixed_users: 10         # Users doing both
    websocket_users: 0      # WebSocket connections (disabled for realistic test)
    async_users: 0          # Async processing users (disabled for realistic test)
  
  # Load Patterns - Optimized for 8 vCPU, 16GB RAM servers
  load_patterns:
    ramp_up:
      start_users: 1
      end_users: 15
      duration: "2m"        # Faster ramp up for server specs
    
    sustained:
      users: 15
      duration: "20m"       # Sustained realistic load
    
    peak:
      users: 20             # Peak load matching server capacity
      duration: "5m"        # Longer peak period for stress testing
    
    burst:
      users: 25             # Burst load testing LLM_MAX_CONCURRENT=30
      duration: "2m"        # Short burst to test limits
    
    ramp_down:
      start_users: 15
      end_users: 0
      duration: "2m"
  
  # Realistic User Behavior Patterns
  user_behavior:
    think_time:
      min: 30000            # 30 seconds minimum between questions
      max: 180000           # 3 minutes maximum between questions
      distribution: "normal" # Normal distribution around average
      average: 90000        # 90 seconds average think time
    
    reading_time:
      base: 5000            # 5 seconds base reading time
      per_word: 200         # 200ms per word (300 WPM reading speed)
      max: 120000           # 2 minutes maximum reading time
    
    session_duration:
      min: 300000           # 5 minutes minimum session
      max: 1800000          # 30 minutes maximum session
      average: 900000       # 15 minutes average session
    
    questions_per_session:
      min: 1
      max: 8
      average: 3            # Average 3 questions per session
    
    natural_pauses:
      enabled: true
      probability: 0.3      # 30% chance of longer pause
      duration: 300000      # 5 minute pause (user distraction)
  
  # Performance Targets - Optimized for 8 vCPU, 16GB RAM servers
  performance_targets:
    response_time_p95: 15000  # ms (15s for P95 with full response time)
    response_time_p99: 22000  # ms (22s for P99 with full response time)
    error_rate_max: 1.0       # percentage (stricter for production-grade servers)
    throughput_min: 3         # requests per second (higher with better specs)
    
    # Streaming specific targets - optimized for server specs
    streaming_first_token_max: 6000   # ms (6s realistic for LLM processing)
    streaming_total_time_max: 18000   # ms (18s realistic for full response)
    
    # WebSocket targets
    websocket_connection_time_max: 1000  # ms
    websocket_error_rate_max: 2.0        # percentage
    
    # Redis/Async targets
    async_processing_time_max: 30000     # ms
    redis_queue_depth_max: 100           # requests
    
    # Evaluation thresholds for pass/fail/borderline assessment
    # Production-grade thresholds - staging must meet production standards
    success_rate:
      pass_threshold: 95.0        # 95%+ success rate required
      borderline_threshold: 90.0  # 90-95% is borderline
    
    error_rate:
      pass_threshold: 5.0         # <5% error rate required
      borderline_threshold: 10.0  # 5-10% is borderline
    
    avg_response_time:
      pass_threshold: 15000       # <15s average response time (realistic)
      borderline_threshold: 20000 # 15-20s is borderline
    
    p95_response_time:
      pass_threshold: 18000       # <18s P95 response time (realistic)
      borderline_threshold: 24000 # 18-24s is borderline
    
    first_token_time:
      pass_threshold: 6000        # <6s to first token (realistic for LLM)
      borderline_threshold: 8000  # 6-8s is borderline
    
    requests_per_second:
      pass_threshold: 1.0         # >1.0 RPS for optimized LLM workloads
      borderline_threshold: 0.5   # 0.5-1.0 RPS is borderline

# Test Data Configuration
test_data:
  corpus_filters:
    - corpus: "hansard"
      date_range:
        start: "1900"
        end: "2000"
    - corpus: "hansard"
      date_range:
        start: "2000"
        end: "2020"
    - corpus: "all"
  
  question_types:
    - "parliamentary_debates"
    - "government_policy"
    - "historical_events"
    - "legislation"
  
  feedback_distribution:
    thumbs_up: 70
    thumbs_down: 30
    with_comment: 25  # percentage of feedback with comments

# Monitoring and Reporting
monitoring:
  metrics_export_interval: 30  # seconds
  detailed_logging: true
  export_format: "json"
  
  # Custom metrics collection
  custom_metrics:
    - "streaming_performance"
    - "redis_queue_stats"
    - "websocket_stability"
    - "user_journey_completion"

# Infrastructure Assumptions - 8 vCPU, 16GB RAM servers
infrastructure:
  backend_workers: 8              # Matching GUNICORN_WORKERS
  redis_instances: 1
  load_balancer: "nginx"
  ssl_enabled: true
  llm_max_concurrent: 30          # Matching LLM_MAX_CONCURRENT
  websocket_max_connections: 100  # Matching WEBSOCKET_MAX_CONNECTIONS
  
  # Expected bottlenecks
  expected_bottlenecks:
    - "llm_inference"
    - "vector_search"
    - "redis_queue"
    - "memory_pressure"           # Added for higher concurrency

# Safety Limits
safety:
  max_concurrent_users: 100
  max_test_duration: "60m"
  circuit_breaker:
    error_threshold: 20.0  # percentage
    timeout_threshold: 10000  # ms
  
  # Rate limiting - realistic human behavior
  rate_limits:
    requests_per_user_per_minute: 4    # Max 4 questions per minute (realistic)
    concurrent_connections_per_user: 2  # Reduced concurrent connections

# Environment Variables (reference - loaded from .env.production)
env_vars:
  VITE_API_URL: "${VITE_API_URL}"
  VITE_USE_COGNITO_AUTH: "${VITE_USE_COGNITO_AUTH}"
  REDIS_URL: "${REDIS_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL}"
  CORS_ORIGINS: "${CORS_ORIGINS}"

# Test Scenarios - Realistic usage patterns
scenarios:
  realistic_usage:
    description: "Realistic 15-user concurrent load test (optimized for server specs)"
    duration: "30m"
    users: 15
    user_types: ["question_users", "feedback_users", "mixed_users"]
    think_time_enabled: true
    natural_pauses_enabled: true
  
  steady_state:
    description: "Steady state performance test (server baseline)"
    duration: "20m"
    users: 15
    user_types: ["question_users", "mixed_users"]
    think_time_enabled: true
    streaming_ratio: 1.0
  
  peak_realistic:
    description: "Realistic peak load (20 users - server capacity)"
    duration: "10m"
    users: 20
    user_types: ["question_users", "feedback_users", "mixed_users"]
    think_time_enabled: true
    reduced_think_time: true  # Slightly faster during peak
  
  burst_test:
    description: "Burst load test (25 users - testing LLM_MAX_CONCURRENT)"
    duration: "5m"
    users: 25
    user_types: ["question_users", "mixed_users"]
    think_time_enabled: false  # Aggressive testing
    reduced_think_time: true
  
  focus_group:
    description: "Focus group simulation (15-20 users, realistic behavior)"
    duration: "45m"
    users: 18
    user_types: ["question_users", "feedback_users", "mixed_users"]
    extended_sessions: true
    think_time_enabled: true
    natural_pauses_enabled: true
  
  long_session:
    description: "Long user session simulation (optimized)"
    duration: "60m"
    users: 12
    user_types: ["mixed_users"]
    extended_sessions: true
    think_time_enabled: true