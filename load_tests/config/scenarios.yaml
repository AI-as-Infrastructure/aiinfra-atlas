# Load Testing Scenarios Configuration for ATLAS

# Default Configuration
defaults:
  wait_time_min: 2      # seconds
  wait_time_max: 8      # seconds
  spawn_rate: 2         # users per second
  run_time: "10m"       # default test duration

# Scenario Definitions
scenarios:
  
  # Basic Scenarios
  quick_smoke_test:
    name: "Quick Smoke Test"
    description: "Fast smoke test to verify basic functionality"
    duration: "3m"
    users: 5
    spawn_rate: 1
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 80
      - class: "FeedbackUser"
        weight: 20
    tags: ["smoke", "quick", "basic"]
  
  basic_load_test:
    name: "Basic Load Test"
    description: "Standard load test with mixed user behavior"
    duration: "15m"
    users: 20
    spawn_rate: 2
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 50
      - class: "MixedFeedbackUser"
        weight: 30
      - class: "FeedbackUser"
        weight: 20
    tags: ["basic", "mixed", "standard"]
  
  # Performance Testing Scenarios
  streaming_performance:
    name: "Streaming Performance Test"
    description: "Focus on streaming endpoint performance and first token timing"
    duration: "12m"
    users: 15
    spawn_rate: 2
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 100
    custom_settings:
      streaming_focus: true
      measure_first_token: true
    tags: ["streaming", "performance", "latency"]
  
  high_concurrency:
    name: "High Concurrency Test"
    description: "Test system behavior under high concurrent load"
    duration: "20m"
    users: 40
    spawn_rate: 3
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 60
      - class: "MixedFeedbackUser"
        weight: 25
      - class: "FeedbackUser"
        weight: 15
    tags: ["concurrency", "stress", "high-load"]
  
  # WebSocket Scenarios
  websocket_stress:
    name: "WebSocket Stress Test"
    description: "Test WebSocket connection handling and message throughput"
    duration: "15m"
    users: 25
    spawn_rate: 2
    user_classes:
      - class: "WebSocketUser"
        weight: 70
      - class: "AsyncWebSocketUser"
        weight: 30
    tags: ["websocket", "real-time", "connections"]
  
  websocket_stability:
    name: "WebSocket Stability Test"
    description: "Long-running WebSocket connections to test stability"
    duration: "30m"
    users: 15
    spawn_rate: 1
    user_classes:
      - class: "WebSocketUser"
        weight: 100
    custom_settings:
      long_connections: true
      connection_lifetime: "25m"
    tags: ["websocket", "stability", "long-running"]
  
  # Async Processing Scenarios
  async_processing:
    name: "Async Processing Test"
    description: "Test async endpoints and Redis queue performance"
    duration: "18m"
    users: 12
    spawn_rate: 1
    user_classes:
      - class: "AsyncProcessingUser"
        weight: 70
      - class: "RedisMonitorUser"
        weight: 30
    tags: ["async", "redis", "queue"]
  
  queue_saturation:
    name: "Queue Saturation Test"
    description: "Push Redis queue to capacity limits"
    duration: "15m"
    users: 30
    spawn_rate: 5
    user_classes:
      - class: "AsyncProcessingUser"
        weight: 90
      - class: "RedisMonitorUser"
        weight: 10
    custom_settings:
      rapid_submission: true
      monitor_queue_depth: true
    tags: ["queue", "saturation", "redis", "limits"]
  
  # Mixed Realistic Scenarios  
  realistic_usage:
    name: "Realistic Usage Pattern"
    description: "Simulate realistic user behavior patterns"
    duration: "25m"
    users: 30
    spawn_rate: 2
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 45
      - class: "MixedFeedbackUser"
        weight: 35
      - class: "WebSocketUser"
        weight: 10
      - class: "AsyncProcessingUser"
        weight: 10
    custom_settings:
      realistic_wait_times: true
      session_persistence: true
    tags: ["realistic", "mixed", "production-like"]
  
  business_hours_simulation:
    name: "Business Hours Simulation"
    description: "Simulate typical business hours usage with peaks and valleys"
    duration: "45m"
    users: 35
    spawn_rate: 1.5
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 50
      - class: "MixedFeedbackUser"
        weight: 30
      - class: "FeedbackUser"
        weight: 15
      - class: "WebSocketUser"
        weight: 5
    custom_settings:
      variable_load: true
      peak_hours: ["10:00", "14:00", "16:00"]
    tags: ["business-hours", "variable", "realistic"]
  
  # Stress Testing Scenarios
  stress_test:
    name: "System Stress Test"
    description: "Push system beyond normal capacity to find breaking points"
    duration: "20m"
    users: 60
    spawn_rate: 4
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 60
      - class: "MixedFeedbackUser"
        weight: 25
      - class: "WebSocketUser"
        weight: 10
      - class: "AsyncProcessingUser"
        weight: 5
    tags: ["stress", "breaking-point", "limits"]
  
  spike_test:
    name: "Traffic Spike Test"
    description: "Sudden traffic spikes to test system resilience"
    duration: "15m"
    users: 50
    spawn_rate: 10  # Rapid spawn
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 80
      - class: "MixedFeedbackUser"
        weight: 20
    custom_settings:
      spike_pattern: true
      spike_duration: "2m"
      recovery_monitoring: true
    tags: ["spike", "resilience", "rapid"]
  
  # Endurance Testing
  endurance_test:
    name: "System Endurance Test"
    description: "Long-running test to identify memory leaks and degradation"
    duration: "60m"
    users: 25
    spawn_rate: 1
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 40
      - class: "MixedFeedbackUser"
        weight: 30
      - class: "WebSocketUser"
        weight: 20
      - class: "AsyncProcessingUser"
        weight: 10
    custom_settings:
      memory_monitoring: true
      performance_degradation_detection: true
    tags: ["endurance", "memory", "degradation", "long-running"]
  
  # Authentication Testing
  auth_performance:
    name: "Authentication Performance Test"
    description: "Test authentication system under load"
    duration: "15m"
    users: 20
    spawn_rate: 2
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 100
    custom_settings:
      auth_required: true
      token_refresh_testing: true
    tags: ["auth", "cognito", "security"]
  
  # Specialized Scenarios
  document_search_heavy:
    name: "Document Search Heavy Test"
    description: "Focus on document search and retrieval performance"
    duration: "12m"
    users: 15
    spawn_rate: 2
    user_classes:
      - class: "QuestionSubmissionUser"
        weight: 100
    custom_settings:
      search_focus: true
      complex_queries: true
      large_result_sets: true
    tags: ["search", "documents", "retrieval"]
  
  feedback_intensive:
    name: "Feedback Intensive Test"
    description: "Heavy feedback submission and processing"
    duration: "10m"
    users: 20
    spawn_rate: 3
    user_classes:
      - class: "FeedbackUser"
        weight: 70
      - class: "MixedFeedbackUser"
        weight: 30
    custom_settings:
      high_feedback_rate: true
      bulk_feedback_testing: true
    tags: ["feedback", "intensive", "user-input"]

# Load Patterns
load_patterns:
  constant:
    description: "Constant load throughout test"
    pattern: "constant"
  
  ramp_up:
    description: "Gradual increase in load"
    pattern: "ramp"
    ramp_duration: "30%"  # 30% of total test time
  
  step_up:
    description: "Step-wise load increases"
    pattern: "steps"
    steps: 3
    step_duration: "25%"
  
  spike:
    description: "Sudden load spikes"
    pattern: "spike"
    spike_multiplier: 3
    spike_duration: "10%"
  
  wave:
    description: "Wave-like load pattern"
    pattern: "wave"
    wave_count: 3
    peak_multiplier: 2

# Performance Thresholds
thresholds:
  response_time:
    p50: 1000   # ms
    p95: 3000   # ms
    p99: 5000   # ms
  
  error_rate:
    max: 5.0    # percentage
  
  throughput:
    min: 10     # requests per second
  
  streaming:
    first_token_max: 2000   # ms
    total_time_max: 15000   # ms
  
  websocket:
    connection_time_max: 1000   # ms
    message_latency_max: 500    # ms
  
  redis:
    queue_depth_max: 100        # requests
    processing_time_max: 30000  # ms

# Test Data Sets
test_data_sets:
  small:
    questions: 100
    feedback_items: 50
    sessions: 20
  
  medium:
    questions: 500
    feedback_items: 200
    sessions: 100
  
  large:
    questions: 1000
    feedback_items: 500
    sessions: 200

# Reporting Configuration
reporting:
  formats: ["html", "json", "csv"]
  include_charts: true
  detailed_metrics: true
  export_raw_data: false
  
  custom_reports:
    - "streaming_analysis"
    - "websocket_stability"
    - "queue_performance"
    - "user_journey_analysis"