# Staging Environment Configuration for ATLAS Load Testing

# Environment Settings
environment:
  name: "staging"
  host: "${VITE_API_URL}"  # Uses VITE_API_URL from .env.staging
  api_version: "v1"

# Authentication Configuration
# Load tests assume VITE_USE_COGNITO_AUTH=false in .env files

# Redis Configuration
redis:
  url: "${REDIS_URL}"
  password: "${REDIS_PASSWORD}"
  queue_name: "llm_request_queue"
  ttl: 3600  # 1 hour

# Load Testing Parameters
load_test:
  # User Distribution (percentages should sum to 100)
  user_distribution:
    question_users: 60      # Users primarily asking questions
    feedback_users: 20      # Users primarily giving feedback
    mixed_users: 15         # Users doing both
    websocket_users: 3      # WebSocket connections
    async_users: 2          # Async processing users
  
  # Load Patterns
  load_patterns:
    ramp_up:
      start_users: 1
      end_users: 30
      duration: "5m"
    
    sustained:
      users: 30
      duration: "20m"
    
    peak:
      users: 50
      duration: "5m"
    
    ramp_down:
      start_users: 30
      end_users: 0
      duration: "2m"
  
  # Performance Targets
  performance_targets:
    response_time_p95: 3000  # ms
    response_time_p99: 5000  # ms
    error_rate_max: 5.0      # percentage
    throughput_min: 10       # requests per second
    
    # Streaming specific targets
    streaming_first_token_max: 2000  # ms
    streaming_total_time_max: 15000  # ms
    
    # WebSocket targets
    websocket_connection_time_max: 1000  # ms
    websocket_error_rate_max: 2.0        # percentage
    
    # Redis/Async targets
    async_processing_time_max: 30000     # ms
    redis_queue_depth_max: 100           # requests
    
    # Evaluation thresholds for pass/fail/borderline assessment
    # Production-grade thresholds - staging must meet production standards
    success_rate:
      pass_threshold: 95.0        # 95%+ success rate required
      borderline_threshold: 90.0  # 90-95% is borderline
    
    error_rate:
      pass_threshold: 5.0         # <5% error rate required
      borderline_threshold: 10.0  # 5-10% is borderline
    
    avg_response_time:
      pass_threshold: 2000        # <2s average response time
      borderline_threshold: 4000  # 2-4s is borderline
    
    p95_response_time:
      pass_threshold: 5000        # <5s P95 response time
      borderline_threshold: 8000  # 5-8s is borderline
    
    first_token_time:
      pass_threshold: 4000        # <4s to first token (user expectation)
      borderline_threshold: 5000  # 4-5s is borderline
    
    requests_per_second:
      pass_threshold: 10.0        # >10 RPS required for production load
      borderline_threshold: 5.0   # 5-10 RPS is borderline

# Test Data Configuration
test_data:
  corpus_filters:
    - corpus: "hansard"
      date_range:
        start: "1900"
        end: "2000"
    - corpus: "hansard"
      date_range:
        start: "2000"
        end: "2020"
    - corpus: "all"
  
  question_types:
    - "parliamentary_debates"
    - "government_policy"
    - "historical_events"
    - "legislation"
  
  feedback_distribution:
    thumbs_up: 70
    thumbs_down: 30
    with_comment: 25  # percentage of feedback with comments

# Monitoring and Reporting
monitoring:
  metrics_export_interval: 30  # seconds
  detailed_logging: true
  export_format: "json"
  
  # Custom metrics collection
  custom_metrics:
    - "streaming_performance"
    - "redis_queue_stats"
    - "websocket_stability"
    - "user_journey_completion"

# Infrastructure Assumptions
infrastructure:
  backend_workers: 4
  redis_instances: 1
  load_balancer: "nginx"
  ssl_enabled: true
  
  # Expected bottlenecks
  expected_bottlenecks:
    - "llm_inference"
    - "vector_search"
    - "redis_queue"

# Safety Limits
safety:
  max_concurrent_users: 100
  max_test_duration: "60m"
  circuit_breaker:
    error_threshold: 20.0  # percentage
    timeout_threshold: 10000  # ms
  
  # Rate limiting
  rate_limits:
    requests_per_user_per_minute: 30
    concurrent_connections_per_user: 5

# Environment Variables (reference - loaded from .env.staging)
env_vars:
  VITE_API_URL: "${VITE_API_URL}"
  VITE_USE_COGNITO_AUTH: "${VITE_USE_COGNITO_AUTH}"
  REDIS_URL: "${REDIS_URL}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL}"
  CORS_ORIGINS: "${CORS_ORIGINS}"

# Test Scenarios
scenarios:
  basic_load_test:
    description: "Basic load test with mixed user types"
    duration: "30m"
    users: 30
    user_types: ["question_users", "feedback_users", "mixed_users"]
  
  streaming_focus:
    description: "Focus on streaming endpoint performance"
    duration: "15m"
    users: 25
    user_types: ["question_users"]
    streaming_ratio: 0.8
  
  websocket_stress:
    description: "WebSocket connection stress test"
    duration: "20m"
    users: 20
    user_types: ["websocket_users", "mixed_users"]
  
  async_processing:
    description: "Async processing and queue performance"
    duration: "25m"
    users: 15
    user_types: ["async_users", "question_users"]
  
  peak_load:
    description: "Peak load simulation"
    duration: "10m"
    users: 50
    user_types: ["question_users", "feedback_users", "mixed_users", "websocket_users"]