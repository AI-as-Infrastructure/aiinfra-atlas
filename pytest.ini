[pytest]
# Pytest configuration for ATLAS

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require external services like Phoenix)
    slow: Slow-running tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    # Uncomment for coverage reporting:
    # --cov=backend
    # --cov-report=html
    # --cov-report=term-missing

# Async test support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Ignore these directories
norecursedirs = .git .tox dist build *.egg __pycache__ node_modules frontend

# Minimum Python version
minversion = 3.10
